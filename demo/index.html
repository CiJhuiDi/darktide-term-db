    {t:"大漩涡任务 I-II", d:"", detail:"一波又一波的专家敌人。怪物专家（专家敌人有几率变成较弱的怪物）。", enhanced:"专家波次 + 怪物专家：全程高密度专家压力，建议携带反精英武器；注意专家随时可能变异为弱化怪物，预留爆发技能。"},
    {t:"大漩涡任务 I-II-V-E-G", d:"", detail:"一波又一波的专家敌人。纳垢的祝福（敌人有几率获得增益，从而变得更强）。怪物专家（专家敌人有几率变成较弱的怪物）。只有血痂阵营。强化闪击。", enhanced:"专家波次 + 怪物专家 + 远程为主 + 纳垢的祝福 + 血痂 + 强化闪击：复合高压，精英与远程双重威胁，技能要省着交。"},
    {t:"大漩涡任务 I-III", d:"", detail:"一波又一波的专家敌人。狩猎场。", enhanced:"专家波次 + 狩猎场：精英与专家双多，清精英节奏要快，防被包夹。"},

    {t:"大漩涡任务 I-IX-E-F", d:"", detail:"一波又一波的变异人。纳垢的祝福（敌人有几率获得增益，从而变得更强悍）。一波又一波的专家敌人。玩家获得20%能力冷却时间减免。", enhanced:"变异人波次 + 纳垢的祝福 + 专家波次 + 20%冷却减免：变异人冲阵 + 祝福变数，用控制技能打断变异人冲锋。"},

{ t:"浩劫", en:"Havoc", cat:"mission", keep:true, src:"浩劫模式/任务/官方描述", d:"角色满级（30 级）后的高难周常模式，有专属任务订单与词条；需先完成大漩涡任务证明资格。", r:["大漩涡","词条"],

{ t:"供电中断", en:"Darkness", cat:"mission", keep:true, src:"词条(供电中断)", d:"任务期间供电中断，视野受限，敌人更难被发现。", r:["词条"] },
{ t:"瘟疫毒气", en:"Toxic Gas", cat:"mission", keep:true, src:"词条(瘟疫毒气)", d:"任务区域弥漫毒气，持续扣血，需留意净化点或防毒手段。", r:["词条"] },
{ t:"通风净化", en:"Ventilation Purge", cat:"mission", keep:true, src:"词条(通风净化)", d:"需要定期启动通风净化清除危险气体，期间敌人会涌出。", r:["词条"] },
{ t:"狩猎场", en:"Hunting Grounds", cat:"mission", keep:true, src:"词条(狩猎场)", d:"精英/专家敌人显著增多。", r:["词条"] },
{ t:"突击部队挑战", en:"Waves of Specials", cat:"mission", keep:true, src:"词条(突击部队挑战)", d:"特殊敌人（专家）以波次形式来袭。", r:["词条"] },
{ t:"高强度", en:"Increased Resistance", cat:"mission", keep:true, src:"词条(高强度挑战)", d:"敌人更强/更多的高难词条（高强度挑战、高强度交战区等）。", r:["词条"] },
];
</script>
<script>
// ============ 分类 ============
const CATS = [
  { id:"all", name:"全部" },
  { id:"damage", name:"伤害机制" },
  { id:"defense", name:"防御机制" },
  { id:"action", name:"攻击动作" },
  { id:"gear", name:"装备属性" },
  { id:"enemy", name:"敌人" },
  { id:"mission", name:"任务与词条" },
];
const CAT_NAMES = { damage:"伤害机制", defense:"防御机制", action:"攻击动作", gear:"装备属性", mission:"任务与词条", enemy:"敌人" };

// ============ 状态 ============
let curCat = "all", curPath = TERMS[0].t, query = "";
const expanded = {};   // 父条目展开状态
const byName = {};     // path -> 条目(平铺 + "父/子")

TERMS.forEach(x => {
  byName[x.t] = x;
  if (x.children) {
    expanded[x.t] = false;
    x.children.forEach(c => { byName[x.t + "/" + c.t] = Object.assign({ parent: x.t }, c); });
  }
});

const isChildPath = p => p.indexOf("/") > 0;
const parentOf = p => p.split("/")[0];

// ============ 渲染 ============
function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  CATS.forEach(c => {
    const cnt = c.id === "all" ? TERMS.length : TERMS.filter(x => x.cat === c.id).length;
    const b = document.createElement("div");
    b.className = "tab" + (c.id === curCat ? " active" : "");
    b.innerHTML = `${c.name}<span class="cnt">${cnt}</span>`;
    b.onclick = () => { curCat = c.id; curPath = null; renderTabs(); renderList(); renderDetail(); };
    el.appendChild(b);
  });
}

function filtered() {
  const q = query.toLowerCase();
  return TERMS.filter(x => {
    if (curCat !== "all" && x.cat !== curCat) return false;
    if (!q) return true;
    if (x.t.toLowerCase().includes(q) || x.en.toLowerCase().includes(q)) return true;
    if (x.children) return x.children.some(c => c.t.toLowerCase().includes(q) || (c.detail || "").toLowerCase().includes(q));
    return false;
  });
}

function renderList() {
  const el = document.getElementById("list");
  const items = filtered();
  if (!items.length) {
    el.innerHTML = '<div class="list-empty">没有匹配的术语</div>';
    return;
  }
  el.innerHTML = "";
  items.forEach(x => {
    if (x.children) {
      // 搜索时若有子项命中则强制展开
      let forceOpen = false;
      if (query) {
        forceOpen = x.children.some(c => c.t.toLowerCase().includes(query.toLowerCase()));
      }
      const open = forceOpen || expanded[x.t];
      const node = document.createElement("div");
      node.className = "list-item" + (curPath === x.t ? " active" : "");
      node.innerHTML = `<span class="arrow">${open ? "▾" : "▸"}</span>
        <span class="dot ${x.keep ? "keep" : "pending"}"></span>
        <span><div class="name">${x.t}</div><div class="en">${x.en}</div></span>`;
      node.onclick = () => {
        expanded[x.t] = !expanded[x.t];
        curPath = x.t;
        renderList(); renderDetail();
      };
      el.appendChild(node);
      if (open) {
        const childGroups = {};
        x.children.forEach(c => {
          const g = c.type || "";
          (childGroups[g] = childGroups[g] || []).push(c);
        });
        const GROUP_ICON = { 人形: "🧍 ", 怪物: "👹 ", 固定: "📌 ", 轮换: "🎲 ", 环境: "🌍 " };
        Object.keys(childGroups).forEach(g => {
          if (g && x.children.length > 1) {
            const label = (GROUP_ICON[g] || "") + (g === "人形" ? "人形 Boss" : g === "怪物" ? "怪物 Boss" : g);
            const h = document.createElement("div");
            h.style.cssText = "padding:4px 14px 2px 26px;font-size:11px;color:#8b949e;font-weight:600;user-select:none";
            h.textContent = label + `（${childGroups[g].length}）`;
            el.appendChild(h);
          }
          childGroups[g].forEach(c => {
            const path = x.t + "/" + c.t;
            const d = document.createElement("div");
            d.className = "list-item child" + (curPath === path ? " active" : "");
            d.innerHTML = `<span class="dot ${x.keep ? "keep" : "pending"}"></span>
              <span class="name">${c.t}</span>`;
            d.onclick = () => { curPath = path; renderList(); renderDetail(); };
            el.appendChild(d);
          });
        });
      }
    } else {
      const d = document.createElement("div");
      d.className = "list-item" + (curPath === x.t ? " active" : "");
      d.innerHTML = `<span class="dot ${x.keep ? "keep" : "pending"}"></span>
        <span><div class="name">${x.t}</div><div class="en">${x.en}</div></span>`;
      d.onclick = () => { curPath = x.t; renderList(); renderDetail(); };
      el.appendChild(d);
    }
  });
}

function renderDetail() {
  const el = document.getElementById("detail");
  const x = curPath ? byName[curPath] : null;
  if (!x) {
    el.innerHTML = '<div class="d-empty">← 点击左侧术语查看详情</div>';
    return;
  }

  if (isChildPath(curPath)) {
    // 子词条详情:人工增强 + 官方原文
    const parent = byName[x.parent];
    const wipBadge = x.wip ? '<span class="badge pending">⚠️ WIP 未实装</span>' : '';
    el.innerHTML = `
      <div class="d-title">
        <h2>${x.t}</h2>
        <span class="badge cat">${CAT_NAMES[parent.cat]} · ${x.parent}</span>
        ${wipBadge}
      </div>
      ${x.d ? `<div class="d-desc">${x.d}</div>` : ""}
      ${x.enhanced ? `
      <div class="d-source">🧠 人工增强描述（机制细节 · 实战要点 · 待校对）</div>
      <div class="d-intro">${x.enhanced}</div>` : ""}
      ${x.detail ? `
      <div class="d-source" style="margin-top:18px">📖 官方详细描述</div>
      <div class="d-desc" style="color:#8b949e;font-size:13px">${x.detail}</div>` : ""}
      ${x.armor ? `
      <div class="d-source" style="margin-top:18px">🛡️ 部位护甲（反编译源码）</div>
      <div class="d-intro" style="font-size:13px">${x.armor}</div>` : ""}
      <div class="d-related">
        <h3>⬆ 返回</h3>
        <div class="chips"><span class="chip" onclick="selectTerm('${x.parent}')">${x.parent}（模式介绍）</span></div>
      </div>`;
    return;
  }

  // 普通条目 / 父模式
  const badge = x.keep
    ? '<span class="badge keep">✅ 建议收录</span>'
    : '<span class="badge pending">❓ 待定</span>';
  const chips = (x.r || []).map(r => {
    const target = byName[r];
    if (!target) return `<span class="chip" style="opacity:.5;cursor:default">${r}</span>`;
    return `<span class="chip" onclick="selectTerm('${r}')">${r}</span>`;
  }).join("");

  let extra = "";
  if (x.intro) {
    extra += `<div class="d-intro">${x.intro}</div>`;
  }
  if (x.children) {
    const GROUPS = {
      固定: { label: "📌 固定词条（必出）", color: "#f0c75e" },
      轮换: { label: "🎲 轮换词条（当期池随机抽 2）", color: "#58a6ff" },
      环境: { label: "🌍 环境词条（小概率出现）", color: "#3fb950" },
      人形: { label: "🧍 人形 Boss", color: "#f0c75e" },
      怪物: { label: "👹 怪物 Boss", color: "#f85149" },
    };
    const byGroup = {};
    x.children.forEach(c => {
      const g = c.type || "其他";
      (byGroup[g] = byGroup[g] || []).push(c);
    });
    extra += `<div class="d-childlist">
      <h3>📂 词条（${x.children.length}）— 点击查看详情</h3>`;
    Object.keys(byGroup).forEach(g => {
      const meta = GROUPS[g] || { label: g, color: "#8b949e" };
      extra += `<div style="margin-top:10px;font-size:12px;color:${meta.color};font-weight:600">${meta.label}（${byGroup[g].length}）</div>`;
      byGroup[g].forEach(c => {
        const wip = c.wip ? ' <span style="color:#d29922;font-size:11px;border:1px solid #d2992266;border-radius:10px;padding:0 6px">⚠️ WIP</span>' : '';
        extra += `<div class="child-row" onclick="selectTerm('${x.t}/${c.t}')">
          <span class="ct">${c.t}${wip}</span><span class="cd">${c.d}</span></div>`;
      });
    });
    extra += `</div>`;
  }

  el.innerHTML = `
    <div class="d-title">
      <h2>${x.t}</h2>
      <span class="d-en">${x.en}</span>
      ${badge}
      <span class="badge cat">${CAT_NAMES[x.cat]}</span>
    </div>
    <div class="d-desc">${x.d}</div>
    <div class="d-source">📄 游戏内出处：${x.src}</div>
    ${extra}
    <div class="d-related">
      <h3>⚡ 关联术语</h3>
      <div class="chips">${chips || '<span style="color:#6e7681;font-size:13px">暂无关联</span>'}</div>
    </div>`;
}

function selectTerm(path) {
  curPath = path;
  const x = byName[path];
  if (!x) return;
  if (x.parent) {
    // 选中子词条时确保父节点展开
    expanded[x.parent] = true;
    const p = byName[x.parent];
    if (p && curCat !== "all" && p.cat !== curCat) { curCat = "all"; renderTabs(); }
  } else if (curCat !== "all" && x.cat !== curCat) {
    curCat = "all"; renderTabs();
  }
  renderList();
  renderDetail();
  document.getElementById("list").scrollTop = 0;
}

// ============ 搜索 ============
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim();
  curPath = null;
  renderList();
  renderDetail();
});

// ============ 初始化 ============
renderTabs();
renderList();
renderDetail();
</script>
</body>
</html>
