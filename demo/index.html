{ t:"浩劫", en:"Havoc", cat:"mission", keep:true, src:"浩劫模式/任务/官方描述", d:"角色满级（30 级）后的高难周常模式，有专属任务订单与词条；需先完成大漩涡任务证明资格。浩劫等级越高敌人越强，高难档位为「帝皇之光渐衰（I）（II）」：金级强度激活（敌人伤害/属性拉满）、敌人射速更快、韧性缓冲消失；配套 modifier：近战敌人攻击附带腐化（伤害的10%~30%转永久伤害）、玩家最大生命削减（最高-35%）等；另有腐化敌人变体（紫黑外观，死亡留腐蚀液并传播腐化）、毒气/腐蚀液造成腐化伤害；腐化直接吃生命格，高额腐化（如粉碎者重锤）可跳过倒地直接死亡。爬层实测：难度3大漩涡通关解锁1层、难度5大漩涡通关解锁16层；与房间层差0-5层通关+1层、6-9层+2层、10层以上+3层；每层3次失败机会扣完掉一层（40层后失败不掉层）；一周不打掉一层，大版本更新重置回30层。难度对比：金级大漩涡≈20层；1-10层≈难度2-3。40层周奖励：137400金币/23200金刚砂/35100塑钢（30层约一半）。", r:["大漩涡", "词条", "金级", "浩劫许可等级", "最高浩劫层数"],
  intro:"角色满级（30 级）后的高难周常模式：需先完成大漩涡任务证明资格（金级大漩涡视为达标）；浩劫许可等级 = 完成过的最高任务等级；每周计时器归零生成新任务；不会自动匹配，需自行组队。数值随层数线性提升，40 层为例：【玩家削弱】最大生命-35%、最大韧性-45、连携韧性恢复-50%、弹药拾取-60%（含弹药箱，老兵回雷同减）、灵能散热时长/间隔+85%；【敌人强化】生成+85%、专家数量上限+6、专家精英生命+50%、Boss 数量+3 生命+70%、尸潮打击质量+170%（更难穿透）生命+30%、攻速+100%、射速+30%、弹匣+125%、近战伤害+50%、近战腐化伤害+30%、欧格林数量+100%、精英数量+100%、尸潮刷新+140%。",

  "帝皇之光渐衰（I）": { py: "dihuangzhiguangjianshuai", first: "dhzgjs" },
  "最后的钟声": { py: "zuihoudezhongsheng", first: "zhdzs" },
  "腐化装甲": { py: "fuhuazhuangjia", first: "fhzj" },
  "瘟疫爆者": { py: "wenyibaozhe", first: "wybz" },
  "污染兴奋剂": { py: "wuranxingfenji", first: "wrxfj" },
  "花园蔓生": { py: "huayuanmansheng", first: "hyms" },
  "烈焰地狱": { py: "lieyandiyu", first: "lydy" },
  "通风净化": { py: "tongfengjinghua", first: "tfjh" },
  "瘟疫毒气": { py: "wenyiduqi", first: "wydq" },
  "供电中断": { py: "gongdianzhongduan", first: "gdzd" },
  "硬化皮肤": { py: "yinghuapifu", first: "yhpf" },
  "金级": { py: "jinji", first: "jj" },
  "浩劫许可等级": { py: "haojiexukedengji", first: "hjxkdj" },
  "最高浩劫层数": { py: "zuigaohaojiecengshu", first: "zghjcs" },
  "词条": { py: "citiao", first: "ct" },
  "狩猎场": { py: "shouliechang", first: "slc" },
  "突击部队挑战": { py: "tujibuduitiaozhan", first: "tjbdtz" },
  "高强度": { py: "gaoqiangdu", first: "gqd" },
  "电刑": { py: "dianxing", first: "dx" },
  "韧性削减": { py: "renxingxuejian", first: "rxxj" },
  "被呕吐": { py: "beioutu", first: "bot" },
};
</script>
<script>
// ============ 分类 ============
const CATS = [
  { id:"all", name:"全部" },
  { id:"damage", name:"伤害机制" },
  { id:"defense", name:"防御机制" },
  { id:"action", name:"攻击动作" },
  { id:"gear", name:"装备属性" },
  { id:"enemy", name:"敌人" },
  { id:"mission", name:"任务与词条" },
  { id:"状态", name:"状态" },
];
const CAT_NAMES = { damage:"伤害机制", defense:"防御机制", action:"攻击动作", gear:"装备属性", mission:"任务与词条", enemy:"敌人", 状态:"状态" };

// ============ 状态 ============
let curCat = "all", curPath = TERMS[0].t, query = "";
const expanded = {};   // 父条目展开状态
const byName = {};     // path -> 条目(平铺 + "父/子")

const resolveChild = (c) => {
  if (c.ref) {
    const lib = byName[c.ref];
    if (lib) return Object.assign({}, lib, c, { t: c.t || c.ref });
    return c;
  }
  return c;
};
// 先建顶级索引(ref 引用可能指向列表中靠后的顶级词条)
TERMS.forEach(x => { byName[x.t] = x; });
TERMS.forEach(x => {
  if (x.children) {
    expanded[x.t] = false;
    x.children.forEach(c => {
      const rc = resolveChild(c);
      const full = x.t + "/" + rc.t;
      byName[full] = Object.assign({ parent: x.t }, rc);
      // 裸名索引: 关联项可直接写子词条名; 不覆盖顶级词条(如 通风净化/瘟疫毒气/供电中断)
      if (!byName[rc.t]) byName[rc.t] = byName[full];
    });
  }
});

const isChildPath = p => p.indexOf("/") > 0;
const parentOf = p => p.split("/")[0];

// ============ 渲染 ============
function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  CATS.forEach(c => {
    const cnt = c.id === "all" ? TERMS.length : TERMS.filter(x => x.cat === c.id).length;
    const b = document.createElement("div");
    b.className = "tab" + (c.id === curCat ? " active" : "");
    b.innerHTML = `${c.name}<span class="cnt">${cnt}</span>`;
    b.onclick = () => { curCat = c.id; curPath = null; renderTabs(); renderList(); renderDetail(); };
    el.appendChild(b);
  });
}

const ARMOR_LINKS = ["无甲", "感染", "狂人", "防弹", "硬壳", "不屈"];
function armorLinkify(text) {
  let out = text;
  ARMOR_LINKS.forEach(a => {
    out = out.split(a).join(`<span class="armor-link" onclick="selectTerm('${a}')">${a}</span>`);
  });
  return out;
}

function matchTerm(name, q) {
  if (name.toLowerCase().includes(q)) return true;
  const p = PYMAP[name];
  if (p) {
    if (p.py.includes(q)) return true;
    if (p.first.includes(q)) return true;
  }
  return false;
}

function filtered() {
  const q = query.toLowerCase();
  return TERMS.filter(x => {
    if (curCat !== "all" && x.cat !== curCat) return false;
    if (!q) return true;
    if (matchTerm(x.t, q) || x.en.toLowerCase().includes(q)) return true;
    if (x.children) return x.children.some(c => { const rc = resolveChild(c); return matchTerm(rc.t, q) || (rc.detail || "").toLowerCase().includes(q); });
    return false;
  });
}

function renderList() {
  const el = document.getElementById("list");
  const items = filtered();
  if (!items.length) {
    el.innerHTML = '<div class="list-empty">没有匹配的术语</div>';
    return;
  }
  el.innerHTML = "";
  items.forEach(x => {
    if (x.children) {
      // 搜索时若有子项命中则强制展开
      let forceOpen = false;
      if (query) {
        forceOpen = x.children.some(c => c.t.toLowerCase().includes(query.toLowerCase()));
      }
      const open = forceOpen || expanded[x.t];
      const node = document.createElement("div");
      node.className = "list-item" + (curPath === x.t ? " active" : "");
      node.innerHTML = `<span class="arrow">${open ? "▾" : "▸"}</span>
        <span class="dot ${x.keep ? "keep" : "pending"}"></span>
        <span><div class="name">${x.t}</div><div class="en">${x.en}</div></span>`;
      node.onclick = () => {
        expanded[x.t] = !expanded[x.t];
        curPath = x.t;
        renderList(); renderDetail();
      };
      el.appendChild(node);
      if (open) {
        const childGroups = {};
        x.children.forEach(c => {
          const rc = resolveChild(c);
          const g = rc.type || "";
          (childGroups[g] = childGroups[g] || []).push(rc);
        });
        const GROUP_ICON = { 人形: "🧍 ", 怪物: "👹 ", 固定: "📌 ", 轮换: "🎲 ", 环境: "🌍 " , 难度档: "难度档" };
        Object.keys(childGroups).forEach(g => {
          if (g && x.children.length > 1) {
            const label = (GROUP_ICON[g] || "") + (g === "人形" ? "人形 Boss" : g === "怪物" ? "怪物 Boss" : g);
            const h = document.createElement("div");
            h.style.cssText = "padding:4px 14px 2px 26px;font-size:11px;color:#8b949e;font-weight:600;user-select:none";
            h.textContent = label + `（${childGroups[g].length}）`;
            el.appendChild(h);
          }
          childGroups[g].forEach(rc => {
            const path = x.t + "/" + rc.t;
            const d = document.createElement("div");
            d.className = "list-item child" + (curPath === path ? " active" : "");
            d.innerHTML = `<span class="dot ${x.keep ? "keep" : "pending"}"></span>
              <span class="name">${rc.t}</span>`;
            d.onclick = () => { curPath = path; renderList(); renderDetail(); };
            el.appendChild(d);
          });
        });
      }
    } else {
      const d = document.createElement("div");
      d.className = "list-item" + (curPath === x.t ? " active" : "");
      d.innerHTML = `<span class="dot ${x.keep ? "keep" : "pending"}"></span>
        <span><div class="name">${x.t}</div><div class="en">${x.en}</div></span>`;
      d.onclick = () => { curPath = x.t; renderList(); renderDetail(); };
      el.appendChild(d);
    }
  });
}

function renderDetail() {
  const el = document.getElementById("detail");
  const x = curPath ? byName[curPath] : null;
  if (!x) {
    el.innerHTML = '<div class="d-empty">← 点击左侧术语查看详情</div>';
    return;
  }

  if (isChildPath(curPath)) {
    // 子词条详情:人工增强 + 官方原文
    const parent = byName[x.parent];
    const wipBadge = x.wip ? '<span class="badge pending">⚠️ WIP 未实装</span>' : '';
    const childChips = (x.r || []).map(r => {
      const target = byName[r];
      if (!target) return `<span class="chip" style="opacity:.5;cursor:default" title="词条未收录">${r}</span>`;
      return `<span class="chip" onclick="selectTerm('${r}')">${r}</span>`;
    }).join("");
    const childRelated = (x.r && x.r.length) ? `
      <div class="d-related">
        <h3>⚡ 关联术语</h3>
        <div class="chips">${childChips}</div>
      </div>` : "";
    el.innerHTML = `
      <div class="d-title">
        <h2>${x.t}</h2>
        <span class="badge cat">${CAT_NAMES[parent.cat]} · ${x.parent}</span>
        ${wipBadge}
      </div>
      ${x.d ? `<div class="d-desc">${x.d}</div>` : ""}
      ${x.enhanced ? `
      <div class="d-source">🧠 人工增强描述（机制细节 · 实战要点 · 待校对）</div>
      <div class="d-intro">${x.enhanced}</div>` : ""}
      ${x.detail ? `
      <div class="d-source" style="margin-top:18px">📖 官方详细描述</div>
      <div class="d-desc" style="color:#8b949e;font-size:13px">${x.detail}</div>` : ""}
      ${x.armor ? `
      <div class="d-source" style="margin-top:18px">🛡️ 部位护甲（游戏文件）</div>
      <div class="d-intro" style="font-size:13px">${typeof x.armor === "string" ? armorLinkify(x.armor) : x.armor.map(a => `<div style="margin:4px 0"><span style="color:#f0c75e;font-weight:600">${a.breed}：</span>${armorLinkify(a.text)}</div>`).join("")}</div>` : ""}
      ${x.moves ? `
      <div class="d-source" style="margin-top:18px">🎯 招式（游戏文件）<span style="color:#666;font-size:11px;margin-left:6px">悬停招式名查看说明</span></div>
      <div class="d-intro" style="font-size:13px">${typeof x.moves === "string" ? x.moves : x.moves.map(g => {
        const tip = (n) => `<span data-tip="${MOVE_DESC[n] || '暂无说明'}" style="cursor:help;border-bottom:1px dashed #666">${n}</span>`;
        if (g.breed) {
          if (g.groups) {
            // breed + 多武器分组(连长双形态)
            return `<div style="margin:6px 0"><span style="color:#f0c75e;font-weight:600">${g.breed}</span>` + g.groups.map(gr => `<div style="margin:3px 0 3px 12px"><span style="color:#58a6ff;font-weight:600">${gr.g}：</span>${gr.list.map(tip).join("、")}</div>`).join("") + `</div>`;
          }
          return `<div style="margin:4px 0"><span style="color:#f0c75e;font-weight:600">${g.breed}：</span>${g.list.map(tip).join("、")}</div>`;
        }
        return `<div style="margin:4px 0"><span style="color:#58a6ff;font-weight:600">${g.g}：</span>${g.list.map(tip).join("、")}</div>`;
      }).join("")}</div>` : ""}
      ${childRelated}
      <div class="d-related">
        <h3>⬆ 返回</h3>
        <div class="chips"><span class="chip" onclick="selectTerm('${x.parent}')">${x.parent}（模式介绍）</span></div>
      </div>`;
    return;
  }

  // 普通条目 / 父模式
  const badge = x.keep
    ? '<span class="badge keep">✅ 建议收录</span>'
    : '<span class="badge pending">❓ 待定</span>';
  const chips = (x.r || []).map(r => {
    const target = byName[r];
    if (!target) return `<span class="chip" style="opacity:.5;cursor:default" title="词条未收录">${r}</span>`;
    return `<span class="chip" onclick="selectTerm('${r}')">${r}</span>`;
  }).join("");

  let extra = "";
  if (x.intro) {
    extra += `<div class="d-intro">${x.intro}</div>`;
  }
  if (x.children) {
    const GROUPS = {
      固定: { label: "📌 固定词条（必出）", color: "#f0c75e" },

      难度档: { label: "难度档（帝皇之光渐衰）", color: "#f85149" },
      轮换: { label: "🎲 轮换词条（当期池随机抽 2）", color: "#58a6ff" },
      环境: { label: "🌍 环境词条（小概率出现）", color: "#3fb950" },
      人形: { label: "🧍 人形 Boss", color: "#f0c75e" },
      怪物: { label: "👹 怪物 Boss", color: "#f85149" },
    };
    const byGroup = {};
    x.children.forEach(c => {
      const rc = resolveChild(c);
      const g = rc.type || "其他";
      (byGroup[g] = byGroup[g] || []).push(rc);
    });
    extra += `<div class="d-childlist">
      <h3>📂 词条（${x.children.length}）— 点击查看详情</h3>`;
    Object.keys(byGroup).forEach(g => {
      const meta = GROUPS[g] || { label: g, color: "#8b949e" };
      extra += `<div style="margin-top:10px;font-size:12px;color:${meta.color};font-weight:600">${meta.label}（${byGroup[g].length}）</div>`;
      byGroup[g].forEach(c => {
        const wip = c.wip ? ' <span style="color:#d29922;font-size:11px;border:1px solid #d2992266;border-radius:10px;padding:0 6px">⚠️ WIP</span>' : '';
        extra += `<div class="child-row" onclick="selectTerm('${x.t}/${c.t}')">
          <span class="ct">${c.t}${wip}</span><span class="cd">${c.d}</span></div>`;
      });
    });
    extra += `</div>`;
  }

  el.innerHTML = `
    <div class="d-title">
      <h2>${x.t}</h2>
      <span class="d-en">${x.en}</span>
      ${badge}
      <span class="badge cat">${CAT_NAMES[x.cat]}</span>
    </div>
    <div class="d-desc">${x.d}</div>
    <div class="d-source">📄 游戏内出处：${x.src}</div>
    ${extra}
    <div class="d-related">
      <h3>⚡ 关联术语</h3>
      <div class="chips">${chips || '<span style="color:#6e7681;font-size:13px">暂无关联</span>'}</div>
    </div>`;
}

function selectTerm(path) {
  let x = byName[path];
  if (!x) return;
  if (x.parent) {
    // 裸名子词条(如 "猎群之主") → 规范为完整路径, 走子词条详情渲染
    if (!path.includes("/")) path = x.parent + "/" + path;
    x = byName[path];
    // 选中子词条时确保父节点展开
    expanded[x.parent] = true;
    const p = byName[x.parent];
    if (p && curCat !== "all" && p.cat !== curCat) { curCat = "all"; renderTabs(); }
  } else if (curCat !== "all" && x.cat !== curCat) {
    curCat = "all"; renderTabs();
  }
  curPath = path;
  renderList();
  renderDetail();
  document.getElementById("list").scrollTop = 0;
}

// ============ 搜索 ============
const qEl = document.getElementById("q");
const clearBtn = document.getElementById("clearQ");
function syncClearBtn() {
  clearBtn.style.display = qEl.value ? "block" : "none";
}
qEl.addEventListener("input", e => {
  query = e.target.value.trim();
  curPath = null;
  syncClearBtn();
  renderList();
  renderDetail();
});
clearBtn.addEventListener("click", () => {
  qEl.value = "";
  query = "";
  curPath = null;
  syncClearBtn();
  renderList();
  renderDetail();
  qEl.focus();
});

// ============ 招式悬停提示(立即显示,无延迟) ============
(() => {
  const tip = document.getElementById("tip");
  let timer = null;
  document.addEventListener("mouseover", e => {
    const t = e.target.closest("[data-tip]");
    if (!t) { hide(); return; }
    tip.textContent = t.dataset.tip;
    tip.style.display = "block";
    move(e);
    if (timer) { clearTimeout(timer); timer = null; }
  });
  document.addEventListener("mousemove", e => { if (tip.style.display === "block") move(e); });
  document.addEventListener("mouseout", e => {
    const t = e.target.closest("[data-tip]");
    if (t && !t.contains(e.relatedTarget)) hide();
  });
  function move(e) {
    const pad = 12;
    let x = e.clientX + pad, y = e.clientY + pad;
    const r = tip.getBoundingClientRect();
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  }
  function hide() { tip.style.display = "none"; }
})();

// ============ 初始化 ============
renderTabs();
renderList();
renderDetail();
</script>
</body>
