<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗潮术语库 · Demo v0.2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0d1117; color: #e6edf3;
  }
  .header {
    position: sticky; top: 0; z-index: 100;
    background: #161b22ee; backdrop-filter: blur(8px);
    padding: 12px 20px; border-bottom: 1px solid #30363d;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .header h1 { font-size: 18px; color: #f0c75e; letter-spacing: 1px; }
  .header .sub { color: #8b949e; font-size: 12px; }
  .search { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .search input {
    background: #21262d; border: 1px solid #30363d; border-radius: 8px;
    color: #e6edf3; padding: 7px 12px; font-size: 13px; width: 220px; outline: none;
  }
  .search input:focus { border-color: #f0c75e; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 20px 0; }
  .tab {
    padding: 6px 14px; border-radius: 8px 8px 0 0; border: 1px solid #30363d; border-bottom: none;
    background: #161b22; color: #8b949e; font-size: 13px; cursor: pointer; user-select: none;
  }
  .tab:hover { color: #e6edf3; }
  .tab.active { background: #21262d; color: #f0c75e; font-weight: 600; }
  .tab .cnt { color: #6e7681; font-size: 11px; margin-left: 4px; }
  .main { display: flex; gap: 0; padding: 12px 20px 24px; min-height: calc(100vh - 120px); }
  .list {
    width: 300px; flex-shrink: 0; border: 1px solid #30363d; border-radius: 10px;
    background: #161b22; overflow-y: auto; max-height: calc(100vh - 150px);
  }
  .list-item {
    padding: 10px 14px; border-bottom: 1px solid #21262d; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background .1s;
  }
  .list-item:hover { background: #1c2129; }
  .list-item.active { background: #262c36; border-left: 3px solid #f0c75e; }
  .list-item .name { font-size: 14px; font-weight: 600; }
  .list-item .en { color: #6e7681; font-size: 11px; }
  .list-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.keep { background: #3fb950; }
  .dot.pending { background: #d29922; }
  .list-empty { padding: 30px; text-align: center; color: #6e7681; font-size: 13px; }
  .detail {
    flex: 1; margin-left: 14px; border: 1px solid #30363d; border-radius: 10px;
    background: #161b22; padding: 22px 26px; min-height: 300px;
  }
  .detail .d-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .detail h2 { font-size: 24px; color: #f0c75e; }
  .detail .d-en { color: #8b949e; font-size: 15px; }
  .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600;
  }
  .badge.keep { background: #1f6feb33; color: #58a6ff; border: 1px solid #1f6feb66; }
  .badge.pending { background: #d2992222; color: #d29922; border: 1px solid #d2992266; }
  .badge.cat { background: #30363d; color: #c9d1d9; border: 1px solid #484f58; }
  .detail .d-desc { margin-top: 16px; font-size: 15px; line-height: 1.7; color: #d0d7de; }
  .detail .d-source { margin-top: 10px; font-size: 12px; color: #6e7681; }
  .detail .d-combos { margin-top: 20px; }
  .detail .d-combos h3 { font-size: 13px; color: #8b949e; margin-bottom: 8px; letter-spacing: 1px; }
  .detail .d-combos table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .detail .d-combos td { padding: 6px 10px; border-bottom: 1px solid #21262d; }
  .detail .d-combos td:first-child { color: #f0c75e; font-weight: 600; white-space: nowrap; width: 140px; }
  .detail .d-combos tr:hover td { background: #1c2129; }
  .detail .d-related { margin-top: 20px; }
  .detail .d-related h3 { font-size: 13px; color: #8b949e; margin-bottom: 8px; letter-spacing: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 6px 14px; border-radius: 20px; border: 1px solid #58a6ff66;
    background: #1f6feb1a; color: #58a6ff; font-size: 13px; cursor: pointer; transition: all .12s;
  }
  .chip:hover { background: #1f6feb44; border-color: #58a6ff; transform: translateY(-1px); }
  .detail .d-empty { color: #6e7681; padding: 40px 0; text-align: center; }
  .footer { padding: 10px 20px; color: #6e7681; font-size: 11px; border-top: 1px solid #21262d; }
  @media (max-width: 760px) {
    .main { flex-direction: column; }
    .list { width: 100%; max-height: 240px; }
    .detail { margin-left: 0; margin-top: 12px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>🜲 暗潮术语库</h1>
  <span class="sub">机制名词 · 作用 · 关系 · Demo v0.2</span>
  <div class="search">
    <input id="q" type="text" placeholder="搜索术语(中文/英文)…">
  </div>
</div>
<div class="tabs" id="tabs"></div>
<div class="main">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"></div>
</div>
<div class="footer">数据:darktide_zh_loc.json 提取 + 人工初稿 · 关联可点击跳转 · 待你定稿去留</div>

<script src="../data/terms.js"></script>
<script>
// ============ 数据(55 条) ============
// cat: damage 伤害机制 / defense 防御机制 / action 攻击动作 / gear 装备属性
// keep: true=建议收录 false=待定


// ============ 分类 ============
const CATS = [
  { id:"all", name:"全部" },
  { id:"damage", name:"伤害机制" },
  { id:"defense", name:"防御机制" },
  { id:"action", name:"攻击动作" },
  { id:"gear", name:"装备属性" },
  { id:"mission", name:"任务与词条" },
];
const CAT_NAMES = { damage:"伤害机制", defense:"防御机制", action:"攻击动作", gear:"装备属性", mission:"任务与词条" };

// ============ 状态 ============
let curCat = "all", curTerm = TERMS[0].t, query = "";

const byName = {};
TERMS.forEach(x => byName[x.t] = x);

// ============ 渲染 ============
function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  CATS.forEach(c => {
    const cnt = c.id === "all" ? TERMS.length : TERMS.filter(x => x.cat === c.id).length;
    const b = document.createElement("div");
    b.className = "tab" + (c.id === curCat ? " active" : "");
    b.innerHTML = `${c.name}<span class="cnt">${cnt}</span>`;
    b.onclick = () => { curCat = c.id; curTerm = null; renderTabs(); renderList(); renderDetail(); };
    el.appendChild(b);
  });
}

function filtered() {
  const q = query.toLowerCase();
  return TERMS.filter(x =>
    (curCat === "all" || x.cat === curCat) &&
    (!q || x.t.toLowerCase().includes(q) || x.en.toLowerCase().includes(q))
  );
}

function renderList() {
  const el = document.getElementById("list");
  const items = filtered();
  if (!items.length) {
    el.innerHTML = '<div class="list-empty">没有匹配的术语</div>';
    return;
  }
  el.innerHTML = "";
  items.forEach(x => {
    const d = document.createElement("div");
    d.className = "list-item" + (x.t === curTerm ? " active" : "");
    d.innerHTML = `<span class="dot ${x.keep ? "keep" : "pending"}"></span>
      <span><div class="name">${x.t}</div><div class="en">${x.en}</div></span>`;
    d.onclick = () => { curTerm = x.t; renderList(); renderDetail(); };
    el.appendChild(d);
  });
}

function renderDetail() {
  const el = document.getElementById("detail");
  const x = curTerm ? byName[curTerm] : null;
  if (!x) {
    el.innerHTML = '<div class="d-empty">← 点击左侧术语查看详情</div>';
    return;
  }
  const badge = x.keep
    ? '<span class="badge keep">✅ 建议收录</span>'
    : '<span class="badge pending">❓ 待定</span>';
  const chips = x.r.map(r => {
    const target = byName[r];
    if (!target) return `<span class="chip" style="opacity:.5;cursor:default">${r}</span>`;
    return `<span class="chip" onclick="selectTerm('${r}')">${r}</span>`;
  }).join("");

  el.innerHTML = `
    <div class="d-title">
      <h2>${x.t}</h2>
      <span class="d-en">${x.en}</span>
      ${badge}
      <span class="badge cat">${CAT_NAMES[x.cat]}</span>
    </div>
    <div class="d-desc">${x.d}</div>
    <div class="d-source">📄 游戏内出处：${x.src}</div>
    ${x.combos ? `<div class="d-combos">
      <h3>📋 固定词条组合</h3>
      <table>${x.combos.map(c => `<tr><td>${c.t}</td><td>${c.d}</td></tr>`).join("")}</table>
    </div>` : ""}
    <div class="d-related">
      <h3>⚡ 关联术语</h3>
      <div class="chips">${chips || '<span style="color:#6e7681;font-size:13px">暂无关联</span>'}</div>
    </div>`;
}

function selectTerm(name) {
  curTerm = name;
  const x = byName[name];
  if (x && curCat !== "all" && x.cat !== curCat) { curCat = "all"; renderTabs(); }
  renderList();
  renderDetail();
  document.getElementById("list").scrollTop = 0;
}

// ============ 搜索 ============
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim();
  curTerm = null;
  renderList();
  renderDetail();
});

// ============ 初始化 ============
renderTabs();
renderList();
renderDetail();
</script>
</body>
</html>
