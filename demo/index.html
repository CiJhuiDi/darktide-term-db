<script>
// ============ 数据(55 条) ============
// cat: damage 伤害机制 / defense 防御机制 / action 攻击动作 / gear 装备属性
// keep: true=建议收录 false=待定


// ============ 分类 ============
const CATS = [
  { id:"all", name:"全部" },
  { id:"damage", name:"伤害机制" },
  { id:"defense", name:"防御机制" },
  { id:"action", name:"攻击动作" },
  { id:"gear", name:"装备属性" },
  { id:"mission", name:"任务与词条" },
];
const CAT_NAMES = { damage:"伤害机制", defense:"防御机制", action:"攻击动作", gear:"装备属性", mission:"任务与词条" };

// ============ 状态 ============
let curCat = "all", curTerm = TERMS[0].t, query = "";

const byName = {};
TERMS.forEach(x => byName[x.t] = x);

// ============ 渲染 ============
function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  CATS.forEach(c => {
    const cnt = c.id === "all" ? TERMS.length : TERMS.filter(x => x.cat === c.id).length;
    const b = document.createElement("div");
    b.className = "tab" + (c.id === curCat ? " active" : "");
    b.innerHTML = `${c.name}<span class="cnt">${cnt}</span>`;
    b.onclick = () => { curCat = c.id; curTerm = null; renderTabs(); renderList(); renderDetail(); };
    el.appendChild(b);
  });
}

function filtered() {
  const q = query.toLowerCase();
  return TERMS.filter(x =>
    (curCat === "all" || x.cat === curCat) &&
    (!q || x.t.toLowerCase().includes(q) || x.en.toLowerCase().includes(q))
  );
}

function renderList() {
  const el = document.getElementById("list");
  const items = filtered();
  if (!items.length) {
    el.innerHTML = '<div class="list-empty">没有匹配的术语</div>';
    return;
  }
  el.innerHTML = "";
  items.forEach(x => {
    const d = document.createElement("div");
    d.className = "list-item" + (x.t === curTerm ? " active" : "");
    d.innerHTML = `<span class="dot ${x.keep ? "keep" : "pending"}"></span>
      <span><div class="name">${x.t}</div><div class="en">${x.en}</div></span>`;
    d.onclick = () => { curTerm = x.t; renderList(); renderDetail(); };
    el.appendChild(d);
  });
}

function renderDetail() {
  const el = document.getElementById("detail");
  const x = curTerm ? byName[curTerm] : null;
  if (!x) {
    el.innerHTML = '<div class="d-empty">← 点击左侧术语查看详情</div>';
    return;
  }
  const badge = x.keep
    ? '<span class="badge keep">✅ 建议收录</span>'
    : '<span class="badge pending">❓ 待定</span>';
  const chips = x.r.map(r => {
    const target = byName[r];
    if (!target) return `<span class="chip" style="opacity:.5;cursor:default">${r}</span>`;
    return `<span class="chip" onclick="selectTerm('${r}')">${r}</span>`;
  }).join("");

  el.innerHTML = `
    <div class="d-title">
      <h2>${x.t}</h2>
      <span class="d-en">${x.en}</span>
      ${badge}
      <span class="badge cat">${CAT_NAMES[x.cat]}</span>
    </div>
    <div class="d-desc">${x.d}</div>
    <div class="d-source">📄 游戏内出处：${x.src}</div>
    ${x.combos ? `<div class="d-combos">
      <h3>📋 ${x.combosLabel || "固定词条组合"}</h3>
      <table>${x.combos.map(c => `<tr><td>${c.t}</td><td>${c.d}</td></tr>`).join("")}</table>
    </div>` : ""}
    <div class="d-related">
      <h3>⚡ 关联术语</h3>
      <div class="chips">${chips || '<span style="color:#6e7681;font-size:13px">暂无关联</span>'}</div>
    </div>`;
}

function selectTerm(name) {
  curTerm = name;
  const x = byName[name];
  if (x && curCat !== "all" && x.cat !== curCat) { curCat = "all"; renderTabs(); }
  renderList();
  renderDetail();
  document.getElementById("list").scrollTop = 0;
}

// ============ 搜索 ============
document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim();
  curTerm = null;
  renderList();
  renderDetail();
});

// ============ 初始化 ============
renderTabs();
renderList();
renderDetail();
</script>
